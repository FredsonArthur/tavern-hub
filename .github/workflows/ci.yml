name: Django CI (TavernHub)

# O fluxo será executado a cada push ou pull request nas branches main ou master
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Configura um serviço temporário de banco de dados PostgreSQL dentro do GitHub Actions
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: tavern_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sua_nova_senha  # ⚠️ Use a mesma senha que definiu no settings.py
        ports:
          - 5432:5432
        # Garante que o PostgreSQL esteja totalmente pronto antes de iniciar os testes
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    # 1. Copia o código do seu repositório para dentro da máquina virtual do GitHub
    - name: Verificar código do repositório
      uses: actions/checkout@v3

    # 2. Configura a versão correta do Python para rodar o projeto
    - name: Configurar Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # 3. Gerencia o cache do pip para acelerar as execuções futuras dos testes
    - name: Cache de dependências do Python
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # 4. Instala todas as dependências listadas no seu requirements.txt
    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 5. Executa as validações de estrutura e a suíte de testes do Django
    - name: Executar testes da aplicação
      env:
        # Passa a senha do banco como variável de ambiente para o Django se conectar
        DB_PASSWORD: sua_nova_senha  # ⚠️ Use a mesma senha que definiu no settings.py
      run: |
        python manage.py check
        python manage.py test