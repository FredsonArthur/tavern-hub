<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>TavernHub - Lobby</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #1a1a1a; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; text-align: center; padding-bottom: 50px; }
        .dice-container { margin-top: 20px; padding: 20px; border: 2px solid #444; display: inline-block; border-radius: 10px; background: #252525; }
        #result { font-size: 3rem; color: #ffcc00; margin: 20px; font-weight: bold; min-height: 60px; }
        .dice-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
        button.dice-btn { background: #8b0000; color: white; border: none; padding: 10px; font-size: 1rem; cursor: pointer; border-radius: 5px; transition: 0.3s; }
        button.dice-btn:hover { background: #ff0000; transform: scale(1.05); }
        .player-setup select, .player-setup input { 
            padding: 10px; border-radius: 5px; border: 1px solid #444; 
            background: #222; color: white; width: 300px; text-align: center; font-size: 1rem; 
        }
        .log-container { margin-top: 40px; max-width: 600px; margin-left: auto; margin-right: auto; background: #222; padding: 20px; border-radius: 8px; border: 1px solid #444; text-align: left; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .log-container h3 { border-bottom: 1px solid #444; padding-bottom: 10px; margin-top: 0; color: #8b0000; }
        .log-lista { max-height: 300px; overflow-y: auto; }
        .log-entry { border-bottom: 1px solid #333; padding: 8px 0; font-size: 0.9rem; display: flex; justify-content: space-between; align-items: center; }
        .log-entry .time { color: #666; font-size: 0.75rem; margin-left: 10px; text-align: right; min-width: 120px; }
        .log-entry span.player { color: #aaa; font-weight: bold; }
        .log-entry span.value { color: #ffcc00; font-weight: bold; margin-left: 5px; }
        .log-entry span.dice-type { color: #8b0000; font-size: 0.8rem; font-style: italic; }
        .badge-edit { font-size: 0.6rem; background: #444; color: #ffcc00; margin-left: 5px; padding: 2px 5px; border-radius: 3px; }
        .btn-rollback { color: #666; text-decoration: none; font-size: 0.8rem; margin-left: 10px; }
        .btn-rollback:hover { color: #ffcc00; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'dashboard' %}">🎲 TavernHub</a>
            <div class="navbar-nav ms-auto">
                <!-- NOVO: Link para o Painel de Estatísticas[cite: 5] -->
                <a href="{% url 'painel_estatisticas' %}" class="btn btn-outline-warning me-2">📊 Estatísticas</a>
                <a href="{% url 'lista_mesas' %}" class="btn btn-outline-danger me-2">Minhas Mesas</a>
                <a href="{% url 'lista_personagens' %}" class="btn btn-outline-primary">Meus Personagens</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="player-setup d-flex justify-content-center mb-4">
            {% if user.is_authenticated %}
                <select id="personagemSelect" class="form-select border-danger">
                    <option value="">Selecione seu Personagem</option>
                    {% for p in personagens %}
                        <option value="{{ p.id }}">{{ p.nome }} ({{ p.classe }})</option>
                    {% endfor %}
                </select>
            {% else %}
                <input type="text" id="playerName" placeholder="Nome do seu Personagem" maxlength="20">
            {% endif %}
        </div>

        <div class="dice-container">
            <div id="result">?</div>
            <div class="dice-grid">
                <button class="dice-btn" onclick="rollDice(4)">D4</button>
                <button class="dice-btn" onclick="rollDice(6)">D6</button>
                <button class="dice-btn" onclick="rollDice(8)">D8</button>
                <button class="dice-btn" onclick="rollDice(10)">D10</button>
                <button class="dice-btn" onclick="rollDice(12)">D12</button>
                <button class="dice-btn" onclick="rollDice(20)">D20</button>
                <button class="dice-btn" onclick="rollDice(100)">D100</button>
            </div>
        </div>

        <div class="log-container">
            <div class="d-flex justify-content-between align-items-center border-bottom mb-2">
                <h3 class="border-0">📜 Log de Combate</h3>
                <div class="dropdown">
                    <button class="btn btn-sm btn-dark dropdown-toggle" type="button" data-bs-toggle="dropdown">Filtrar</button>
                    <ul class="dropdown-menu dropdown-menu-dark">
                        <li><a class="dropdown-item" href="#" onclick="atualizarLog(''); return false;">Todos</a></li>
                        <li><a class="dropdown-item" href="#" onclick="atualizarLog('D20'); return false;">Apenas D20</a></li>
                    </ul>
                </div>
            </div>
            <div id="log-lista" class="log-lista">
                <!-- Rolagens via API -->
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper para o dropdown funcionar -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function atualizarLog(tipo = '') {
            let url = '/api/rolagem/listar/';
            if(tipo) url += '?tipo=' + tipo;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    const lista = document.getElementById('log-lista');
                    if(!lista) return;
                    lista.innerHTML = ''; 
                    data.rolagens.forEach(r => {
                        const entry = document.createElement('div');
                        entry.className = 'log-entry';
                        
                        // Verifica se houve Rollback (edição)
                        const editTag = r.editado ? '<span class="badge-edit">EDITADO</span>' : '';
                        
                        // Link para o Rollback se o usuário for mestre (simplificado visualmente)[cite: 5]
                        const rollbackBtn = `<a href="/rolagem/rollback/${r.id}/" class="btn-rollback" title="Corrigir Valor">🔄</a>`;

                        entry.innerHTML = `
                            <div>
                                <span class="player">${r.jogador}</span> rolou 
                                <span class="value">${r.resultado}</span>
                                <span class="dice-type">(${r.tipo_dado})</span>
                                ${editTag}
                                ${rollbackBtn}
                            </div>
                            <span class="time">${r.data}</span>
                        `;
                        lista.appendChild(entry);
                    });
                })
                .catch(error => console.error('Erro ao buscar log:', error));
        }

        function rollDice(faces) {
            const resultDiv = document.getElementById('result');
            const selectPersonagem = document.getElementById('personagemSelect');
            const inputNome = document.getElementById('playerName');
            
            const personagemId = selectPersonagem ? selectPersonagem.value : null;
            let nomeExibicao = "Aventureiro";

            if (selectPersonagem && selectPersonagem.selectedIndex > 0) {
                nomeExibicao = selectPersonagem.options[selectPersonagem.selectedIndex].text.split(' (')[0];
            } else if (inputNome && inputNome.value.trim() !== "") {
                nomeExibicao = inputNome.value.trim();
            }

            resultDiv.innerText = "...";
            setTimeout(() => {
                const roll = Math.floor(Math.random() * faces) + 1;
                resultDiv.innerText = roll;
                
                if(faces === 20 && roll === 20) resultDiv.style.color = "#00ff00";
                else if(faces === 20 && roll === 1) resultDiv.style.color = "#ff0000";
                else resultDiv.style.color = "#ffcc00";

                fetch('/api/rolagem/salvar/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        "resultado": roll, 
                        "jogador": nomeExibicao, 
                        "tipo_dado": "D" + faces,
                        "personagem_id": personagemId 
                    })
                })
                .then(response => response.json())
                .then(data => { atualizarLog(); })
                .catch(error => console.error('Erro ao salvar:', error));
            }, 300);
        }

        document.addEventListener('DOMContentLoaded', () => atualizarLog());
    </script>
</body>
</html>
