{% extends 'lobby/index.html' %}

{% block content %}
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-white">Minhas Mesas (Mestre)</h2>
        <a href="{% url 'criar_mesa' %}" class="btn btn-danger">
            <i class="fas fa-plus"></i> Nova Mesa
        </a>
    </div>

    <div class="row">
        {% for mesa in mesas %}
        <div class="col-md-6 mb-4">
            <div class="card bg-dark text-white border-danger shadow">
                <div class="card-body">
                    <h5 class="card-title text-danger">{{ mesa.titulo }}</h5>
                    <p class="card-text">{{ mesa.descricao|truncatewords:20 }}</p>
                    <small class="text-muted">Criada em: {{ mesa.data_criacao|date:"d/m/Y" }}</small>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12 text-center">
            <p class="text-muted">Você ainda não mestreia nenhuma mesa.</p>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
